    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- مكتبة الأيقونات FontAwesome -->

    <style>
        :root {
            --bg-deep: #0b0f17;
            --bg-card: #131c2e;
            --bg-card-hover: #192640;
            --primary-gold: #d4af37;
            --primary-gold-light: #f3e5ab;
            --accent-blue: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(212, 175, 55, 0.2);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Readex Pro', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            line-height: 1.7;
            overflow-x: hidden;
        }

        /* خلفية مضيئة خفيفة */
        .ambient-glow {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 400px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.07) 0%, rgba(212, 175, 55, 0.03) 50%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }

        /* حاوية رئيسية */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* الهيدر والترويسة الشخصية */
        header {
            text-align: center;
            padding: 50px 20px;
            background: linear-gradient(135deg, var(--bg-card), var(--bg-deep));
            border: 1px solid var(--border-color);
            border-radius: 24px;
            margin-bottom: 40px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .profile-img-container {
            width: 140px;
            height: 140px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, var(--primary-gold), var(--accent-blue));
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.3);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background-color: var(--bg-card);
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        header h1 span {
            color: var(--primary-gold);
        }

        header p.title {
            font-size: 1.15rem;
            color: var(--accent-blue);
            font-weight: 500;
            margin-bottom: 25px;
        }

        /* معلومات التواصل السريعة */
        .quick-contact {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

            display: inline-flex;
            align-items: center;
